version: 2.1

orbs:
  android: circleci/android@2.5.0

jobs:
  lint:
    executor:
      name: android/android-machine
      resource-class: medium
      tag: 2024.01.1
    environment:
      # daemon=false: no benefit in ephemeral containers; incremental=false: no prior artifacts on clean checkout
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.incremental=false
    steps:
      - checkout
      - android/restore-gradle-cache
      - run:
          name: Run Lint
          command: ./gradlew lint --parallel
      - android/save-gradle-cache
      - store_artifacts:
          path: app/build/reports/lint-results-debug.html
          destination: lint-report

  unit-test:
    executor:
      name: android/android-machine
      resource-class: medium
      tag: 2024.01.1
    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.incremental=false
    steps:
      - checkout
      - android/restore-gradle-cache
      - run:
          name: Run Unit Tests
          command: ./gradlew test --parallel
      - android/save-gradle-cache
      - store_test_results:
          path: app/build/test-results
      - store_artifacts:
          path: app/build/reports/tests
          destination: test-reports

  build:
    executor:
      name: android/android-machine
      resource-class: large
      tag: 2024.01.1
    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Dkotlin.incremental=false
    steps:
      - checkout
      - android/restore-gradle-cache
      - android/restore-build-cache
      - run:
          name: Assemble Debug APK
          command: ./gradlew assembleDebug --parallel --build-cache
      - android/save-gradle-cache
      - android/save-build-cache
      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: debug-apk

workflows:
  build-and-test:
    jobs:
      - lint
      - unit-test
      - build:
          requires:
            - lint
            - unit-test
